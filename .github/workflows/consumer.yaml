# Design §7, roadmap Stage 6: tools/zuexacttest is a package in the shape a
# consumer has (LinkingTo and Imports: zuexact, <zuexact.h>, the table from
# R_GetCCallable). Install zuexact, then the fixture; R CMD check the
# fixture with no error or warning; run its tests.
on:
  push:
    branches: [main, master]
  pull_request:

name: consumer

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ${{ matrix.os }}
    name: fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_SYSTEM_CLOCK_: false
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat

      - name: Install zuexact, then the fixture
        shell: bash
        run: |
          R CMD INSTALL .
          R CMD INSTALL tools/zuexacttest

      - name: R CMD check the fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fixture" && cd "$RUNNER_TEMP/fixture"
          R CMD build "$GITHUB_WORKSPACE/tools/zuexacttest"
          R CMD check --no-manual zuexacttest_*.tar.gz || true
          log=zuexacttest.Rcheck/00check.log
          cat "$log"
          if grep -qE '^Status: .*(ERROR|WARNING)' "$log"; then
            echo "::error::fixture check failed"
            exit 1
          fi

      - name: Run the fixture's tests
        shell: bash
        working-directory: tools/zuexacttest/tests
        run: Rscript testthat.R
