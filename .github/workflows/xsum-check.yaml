# Design §8: upstream's correctness checker and fuzzer run against the
# vendored, patched xsum on the three CI platforms, and the small/large
# threshold benchmark (tools/run-benchmarks) is written to the job summary.
on:
  push:
    branches: [main, master]
  pull_request:

name: xsum-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  xsum-check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # Rtools supplies gcc, make and the POSIX tools on Windows.
      - uses: r-lib/actions/setup-r@v2
        if: runner.os == 'Windows'

      - name: Upstream checker and fuzzer
        env:
          CC: ${{ runner.os == 'Windows' && 'gcc' || 'cc' }}
        run: tools/xsum-check/run 2000000 20261013

      - name: Threshold benchmark
        env:
          CC: ${{ runner.os == 'Windows' && 'gcc' || 'cc' }}
        run: tools/run-benchmarks | tee -a "$GITHUB_STEP_SUMMARY"
