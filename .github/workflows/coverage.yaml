on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Holds a write token, so pinned to a commit (family convention).
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@17264ce002a9359a492e0183852a555a5bb866e7 # v1.23.0
    permissions:
      contents: write
    with:
      # main takes changes only through pull requests (repository ruleset), so
      # the badge commit goes to gh-pages, which already takes bot pushes.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
