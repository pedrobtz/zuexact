# Design §8: tools/vendor/verify on every push (upstream at the pinned commit
# plus tools/patches/ must reproduce src/vendor/), and on pull requests a
# change under src/vendor/ must also change the manifest and checksums.
on:
  push:
    branches: [main, master]
  pull_request:

name: vendor

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
