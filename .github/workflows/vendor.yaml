# Design §8: tools/vendor/verify on every push (upstream at the pinned commit
# plus tools/patches/ must reproduce src/vendor/), and on pull requests a
# change under src/vendor/ must also change the manifest and checksums.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "34 22 * * 6"
  workflow_dispatch:
  pull_request:

name: vendor

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
